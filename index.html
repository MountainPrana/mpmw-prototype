<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MPMW prototype: As printed</title>
<!-- Libraries are stored in lib/ so the page works with no signal. -->
<link rel="stylesheet" href="lib/maplibre-gl.css">
<script src="lib/maplibre-gl.js"></script>
<script src="lib/pmtiles.js"></script>
<style>
  :root { --paper: #d8d4cb; --ink: #1f2a2e; --panel: rgba(255,255,255,.94); --accent: #2f6b4f; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #map { position: absolute; inset: 0; background: var(--paper); }
  .bar { position: absolute; left: 10px; right: 10px; top: calc(env(safe-area-inset-top) + 10px);
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  .chip { background: var(--panel); border-radius: 8px; padding: 6px 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  .title { font-weight: 600; }
  .title small { font-weight: 400; opacity: .7; margin-left: 6px; }
  button, label.btn { font: inherit; background: var(--panel); color: var(--ink); border: 0;
    border-radius: 8px; padding: 6px 10px; box-shadow: 0 1px 4px rgba(0,0,0,.2); cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  #gps { position: absolute; left: 10px; bottom: calc(env(safe-area-inset-bottom) + 34px);
    font-variant-numeric: tabular-nums; max-width: calc(100% - 20px); box-sizing: border-box; }
  #gps.warn { background: #fbe7c6; }
  #msg { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
  #msg[hidden] { display: none; }
  #msg .chip { max-width: 320px; text-align: center; pointer-events: auto; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<div id="map"></div>

<div class="bar">
  <span class="chip title">As printed<small id="mapname"></small></span>
  <button id="fit" title="Show the whole map">Whole map</button>
  <button id="align" aria-pressed="false" title="Lay the map over OpenStreetMap to check it lines up (needs signal)">Check alignment</button>
  <label class="btn" title="Open a .pmtiles file saved on this device">Open file<input id="file" type="file" accept=".pmtiles"></label>
</div>

<div id="gps" class="chip" hidden></div>
<div id="msg" hidden><div class="chip"></div></div>

<script>
// Which map to show. Default is the Worthy Weekend test map; another can be given
// with ?map=path/to/file.pmtiles
const DEFAULT_MAP = "../maps/worthy-weekend/map.pmtiles";
const mapUrl = new URLSearchParams(location.search).get("map") || DEFAULT_MAP;

const protocol = new pmtiles.Protocol();
maplibregl.addProtocol("pmtiles", protocol.tile);

const map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: {
      // Reference map for "Check alignment" only. Needs a signal.
      osm: { type: "raster", tileSize: 256, maxzoom: 19,
        tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
        attribution: "© OpenStreetMap contributors" }
    },
    layers: [
      { id: "paper", type: "background", paint: { "background-color": "#d8d4cb" } },
      { id: "osm", type: "raster", source: "osm", layout: { visibility: "none" } }
    ]
  },
  center: [-108.97, 42.67], zoom: 12,
  maxZoom: 19,            // tiles stop at 17; 18-19 just enlarge them
  dragRotate: false, pitchWithRotate: false, touchPitch: false,
  attributionControl: { compact: true }
});
map.touchZoomRotate.disableRotation();
map.addControl(new maplibregl.ScaleControl({ unit: "imperial", maxWidth: 120 }), "bottom-left");

const geolocate = new maplibregl.GeolocateControl({
  positionOptions: { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 },
  trackUserLocation: true,
  showAccuracyCircle: true,
  fitBoundsOptions: { maxZoom: 16 }
});
map.addControl(geolocate, "bottom-right");

let mapBounds = null;   // [west, south, east, north] of the loaded map

function showMessage(text) {
  const box = document.getElementById("msg");
  box.hidden = !text;
  box.firstElementChild.textContent = text || "";
}

async function loadMap(archive, label) {
  showMessage("Loading map…");
  try {
    protocol.add(archive);
    const h = await archive.getHeader();
    mapBounds = [h.minLon, h.minLat, h.maxLon, h.maxLat];

    if (map.getLayer("printed")) map.removeLayer("printed");
    if (map.getSource("printed")) map.removeSource("printed");
    map.addSource("printed", {
      type: "raster", tileSize: 256,
      url: "pmtiles://" + archive.source.getKey(),
      bounds: mapBounds
    });
    map.addLayer({ id: "printed", type: "raster", source: "printed",
      paint: { "raster-resampling": "linear", "raster-fade-duration": 0 } });

    // Keep the view near the map, but allow some room around it.
    const padX = (h.maxLon - h.minLon) * 0.6, padY = (h.maxLat - h.minLat) * 0.6;
    map.setMaxBounds([[h.minLon - padX, h.minLat - padY], [h.maxLon + padX, h.maxLat + padY]]);
    map.setMinZoom(Math.max(0, h.minZoom - 1));
    fitWhole(false);

    document.getElementById("mapname").textContent =
      label === "default" ? mapUrl.split("/").slice(-2).join("/") : label;
    showMessage("");
  } catch (err) {
    console.error(err);
    showMessage(label === "default"
      ? "Tap Open file and choose a map (.pmtiles) saved on this phone."
      : "Couldn't open the map: " + err.message);
  }
}

function fitWhole(animate = true) {
  if (!mapBounds) return;
  map.fitBounds([[mapBounds[0], mapBounds[1]], [mapBounds[2], mapBounds[3]]],
    { padding: 20, animate });
}

// GPS readout: position, accuracy, and a warning when outside the map.
geolocate.on("geolocate", (e) => {
  const { latitude: lat, longitude: lon, accuracy } = e.coords;
  const box = document.getElementById("gps");
  const feet = Math.round(accuracy * 3.28084);
  let text = `${lat.toFixed(5)}, ${lon.toFixed(5)}  ±${feet} ft`;
  const inside = mapBounds && lon >= mapBounds[0] && lon <= mapBounds[2] &&
                 lat >= mapBounds[1] && lat <= mapBounds[3];
  if (mapBounds && !inside) text += "  ·  You're outside this map";
  box.textContent = text;
  box.classList.toggle("warn", !inside);
  box.hidden = false;
});
geolocate.on("error", (e) => {
  const box = document.getElementById("gps");
  box.textContent = "Location unavailable: " + (e.message || "permission denied?");
  box.classList.add("warn");
  box.hidden = false;
});
geolocate.on("trackuserlocationend", () => {});

document.getElementById("fit").onclick = () => fitWhole();

document.getElementById("align").onclick = (ev) => {
  const on = ev.currentTarget.getAttribute("aria-pressed") !== "true";
  ev.currentTarget.setAttribute("aria-pressed", on);
  map.setLayoutProperty("osm", "visibility", on ? "visible" : "none");
  if (map.getLayer("printed")) map.setPaintProperty("printed", "raster-opacity", on ? 0.55 : 1);
};

// Open a map file stored on the device: reads it straight from the phone, no network.
document.getElementById("file").onchange = (ev) => {
  const file = ev.target.files[0];
  if (file) loadMap(new pmtiles.PMTiles(new pmtiles.FileSource(file)), file.name);
};

map.on("load", () => {
  // On the hosted test site there is no map file next to the page (maps stay out of
  // Git), so the default fails quietly and asks the user to open one from the phone.
  const label = new URLSearchParams(location.search).has("map")
    ? mapUrl.split("/").slice(-2).join("/") : "default";
  loadMap(new pmtiles.PMTiles(mapUrl), label);
});

// Keep a copy of this page on the device so it opens with no signal (see sw.js).
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
